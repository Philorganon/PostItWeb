<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <div class="screen active" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="login-box">
            <div class="logo">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M12 8v4"></path>
                    <path d="M12 16h.01"></path>
                </svg>
            </div>
            <h1>Secure Portal</h1>
            <p>Masukkan kunci rahasia untuk mengakses dashboard.</p>
            
            <div style="margin-top: 30px;">
                <input type="password" id="passwordInput" placeholder="Password" autofocus>
                <button onclick="login()" style="margin-top: 15px;">Akses Sekarang</button>
                <p id="loginError" class="error"></p>
            </div>

            <div style="margin-top: 40px; font-size: 12px; color: var(--text-dim); opacity: 0.6;">
                Protected by nsn
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Interaksi Enter untuk Login
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
